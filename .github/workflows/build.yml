name: Unit Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install dev dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[dev]"

    - name: Run black check
      run: black --check .

    - name: Run flake8
      run: flake8

    - name: Run mypy
      run: mypy knx_stack

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install coverage
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install .

    - name: Run unit tests with coverage
      run: |
        python -m coverage run -m unittest discover -v

    - name: Run doctests
      run: |
        python -m doctest knx_stack/address.py -v
        python -m doctest knx_stack/datapointtypes.py -v
        python -m doctest knx_stack/msg.py -v
        python -m doctest knx_stack/state.py -v
        python -m doctest knx_stack/definition/layer/link/ldata.py -v
        python -m doctest knx_stack/definition/layer/network/address_table.py -v
        python -m doctest knx_stack/definition/layer/transport/association_table.py -v
        python -m doctest knx_stack/definition/layer/application/groupobject_table.py -v
        python -m doctest knx_stack/definition/layer/application/a_property_value.py -v
        python -m doctest knx_stack/encode/knxnet_ip/core/connect/req.py -v
        python -m doctest knx_stack/encode/knxnet_ip/core/disconnect/req.py -v
        python -m doctest knx_stack/encode/knxnet_ip/core/disconnect/res.py -v
        python -m doctest knx_stack/encode/knxnet_ip/core/connectionstate/req.py -v
        python -m doctest knx_stack/encode/knxnet_ip/core/search/req.py -v
        python -m doctest knx_stack/encode/knxnet_ip/tunneling/req.py -v
        python -m doctest knx_stack/encode/knxnet_ip/tunneling/ack.py -v
        python -m doctest knx_stack/encode/knxnet_ip/header.py -v
        python -m doctest knx_stack/encode/layer/application/a_group_value_read/req.py -v
        python -m doctest knx_stack/encode/layer/application/a_group_value_write/req.py -v
        python -m doctest knx_stack/encode/layer/application/a_property_value_read/req.py -v
        python -m doctest knx_stack/encode/layer/application/a_property_value_write/req.py -v
        python -m doctest knx_stack/encode/layer/transport/t_connect/req.py -v
        python -m doctest knx_stack/decode/usb_hid/report_header/report_identifier.py -v
        python -m doctest knx_stack/decode/knxnet_ip/core/search/res.py -v
        python -m doctest knx_stack/decode/knxnet_ip/core/connect/res.py -v
        python -m doctest knx_stack/decode/knxnet_ip/core/disconnect/req.py -v
        python -m doctest knx_stack/decode/knxnet_ip/core/disconnect/res.py -v
        python -m doctest knx_stack/decode/knxnet_ip/core/connectionstate/res.py -v
        python -m doctest knx_stack/decode/knxnet_ip/tunneling/req.py -v
        python -m doctest knx_stack/decode/knxnet_ip/tunneling/ack.py -v
        python -m doctest knx_stack/decode/knxnet_ip/header.py -v
        python -m doctest knx_stack/decode/layer/application/a_group_value_read/ind.py -v
        python -m doctest knx_stack/decode/layer/application/a_group_value_read/con.py -v
        python -m doctest knx_stack/decode/layer/application/a_group_value_write/ind.py -v
        python -m doctest knx_stack/decode/layer/application/a_group_value_write/con.py -v
        python -m doctest knx_stack/decode/layer/application/a_property_value_read/ind.py -v
        python -m doctest knx_stack/decode/layer/application/a_property_value_read/con.py -v
        python -m doctest knx_stack/decode/layer/application/a_property_value_write/ind.py -v
        python -m doctest knx_stack/decode/layer/application/a_property_value_write/con.py -v

    - name: Generate coverage report
      run: |
        python -m coverage report -m
        python -m coverage html

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: htmlcov/

  docs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[docs]"

    - name: Build documentation
      run: make docs

    - name: Upload documentation
      uses: actions/upload-artifact@v4
      with:
        name: docs
        path: docs/build/html/
