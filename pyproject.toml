[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knx-stack"
version = "0.9.2"
description = "A python3 KNX stack for USB HID and KNXnet IP"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Maja Massarini", email = "maja.massarini@gmail.com" }]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications",
    "Intended Audience :: Developers",
]

[project.optional-dependencies]
dev = [
    "flake8",
    "flake8-pyproject",
    "black",
    "mypy",
    "coverage",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
]

[project.urls]
Homepage = "https://github.com/majamassarini/knx-stack"

[tool.setuptools.packages.find]
where = ["."]

[tool.mypy]
no_strict_optional = true
exclude = ["knx_stack/tests/"]

[tool.black]
line-length = 79

[tool.flake8]
max-line-length = 79
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "venv",
    "*.egg-info",
]
extend-ignore = [
    # whitespace before ':' – black formats slices this way
    "E203",
    # line break before binary operator – black prefers this
    "W503",
    # line too long – black handles code; doctest strings can't be wrapped
    "E501",
    # doc line too long – doctest results can exceed any reasonable limit
    "W505",
    # undefined name in string annotations (forward references)
    "F821",
]
per-file-ignores = [
    # deferred imports at bottom of __init__.py break circular imports;
    # the symbols are public API re-exports, not unused imports
    "*/__init__.py:F401,E402",
]
